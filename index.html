const $=s=>document.querySelector(s);
const S={sexo:0,act:1,obj:1,plan:null,res:null,lista:null,done:[],pf:{veg:0,lac:0,glu:0,hue:0,nue:0}};
const PF=[["veg","Vegetariano"],["lac","Sin lácteos"],["glu","Sin gluten"],["hue","Sin huevo"],["nue","Sin frutos secos"]];
const FL={veg:["Pechuga de pollo","Filete de pescado","Carne de res magra","Atún en agua (lata)"],lac:["Leche","Yogurt griego","Yogurt natural","Queso panela","Queso Oaxaca"],glu:["Avena","Pasta integral","Granola","Pan integral (rebanada)"],hue:["Huevo"],nue:["Nueces","Almendras","Cacahuate natural"]};
const norm=s=>s.toLowerCase().normalize("NFD").replace(/[^a-z0-9 ]/g,"");
const excl=k=>{if(PF.some(([f])=>S.pf[f]&&FL[f].includes(k)))return true;return norm($("#av").value).split(/[,;]+/).map(t=>t.trim()).filter(t=>t.length>2).some(t=>(" "+norm(k)).includes(" "+t))};
const ok=([,g])=>!Object.keys(g).some(excl);
function drawChips(){$("#chips").innerHTML=PF.map(([k,n])=>`<button class="chip${S.pf[k]?" on":""}" data-k="${k}">${n}</button>`).join("")}
const catIMC=i=>i<18.5?"Bajo peso":i<25?"Peso normal":i<30?"Sobrepeso":"Obesidad";
const fmtC=(n,c)=>{const u=ING[n][1];if(u==="pza")return Math.ceil(c-1e-9)+" pza";const r=Math.ceil(c/10)*10;return r>=1000?(r/1000).toFixed(2)+(u==="g"?" kg":" L"):r+" "+u};
const fmtP=(n,c)=>{const u=ING[n][1];if(u==="pza"){const x=c<1.5?Math.round(c*2)/2:Math.round(c);return x+" pza"}return Math.round(c/5)*5+" "+u};
const store=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
const load=k=>{try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}};

function drawSeg(){document.querySelectorAll(".seg").forEach(el=>{const n=el.dataset.s;el.style.setProperty("--i",S[n]);el.style.setProperty("--n",OPT[n].length);if(!el.children.length)el.innerHTML=OPT[n].map((o,i)=>`<button data-i="${i}">${o}</button>`).join("");[...el.children].forEach((b,i)=>b.classList.toggle("on",S[n]===i))});$("#cap").textContent=CAPS[S.act]}
document.addEventListener("click",e=>{
 const b=e.target.closest(".seg button");if(b){S[b.parentNode.dataset.s]=+b.dataset.i;drawSeg();save();return}
 const t=e.target.closest("nav button");if(t){show(t.dataset.t);return}
 const d=e.target.closest(".day");if(d){openDay(+d.dataset.d);return}
 if(e.target.id==="sh")$("#sh").classList.remove("on");
 if(e.target.id==="share")share();
 if(e.target.id==="again")calcular(true);
 if(e.target.id==="wadd")addW();
 const c=e.target.closest(".chip");if(c){S.pf[c.dataset.k]=S.pf[c.dataset.k]?0:1;c.classList.toggle("on");save()}
 if(e.target.id==="wuse"){$("#peso").value=S.w[S.w.length-1].w;save();show("perfil")}
 const x=e.target.closest("[data-del]");if(x){S.w.splice(+x.dataset.del,1);store("nsw",S.w);drawProg()}
});
function show(k){["perfil","menu","lista","progreso"].forEach(s=>{$("#"+s).classList.toggle("on",s===k)});document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("on",b.dataset.t===k));window.scrollTo(0,0);document.querySelectorAll("#"+k+" .card").forEach((c,i)=>c.style.setProperty("--i",Math.min(i,9)));document.querySelectorAll("#"+k+" [data-n]").forEach(el=>{const to=+el.dataset.n,dc=(el.dataset.n.split(".")[1]||"").length,t0=performance.now();const f=t=>{const p=Math.min(1,(t-t0)/900),e=1-Math.pow(1-p,3);el.textContent=(to*e).toFixed(dc);if(p<1)requestAnimationFrame(f)};requestAnimationFrame(f)})}
function save(){store("ns",{v:["peso","estatura","edad"].map(i=>$("#"+i).value),sexo:S.sexo,act:S.act,obj:S.obj,pf:S.pf,av:$("#av").value})}

function calcular(sh){
 const f=i=>parseFloat($("#"+i).value.replace(",","."));
 let peso=f("peso"),est=f("estatura");const edad=parseInt($("#edad").value);
 const er=$("#err");er.textContent="";er.classList.remove("shk");const bad=m=>{er.textContent=m;void er.offsetWidth;er.classList.add("shk")};
 if([peso,est,edad].some(isNaN)){bad("Revisa que peso, estatura y edad sean números.");return}
 if(est<3)est*=100;
 if(!(peso>=20&&peso<=300&&est>=100&&est<=250&&edad>=14&&edad<=100)){bad("Peso: 20-300 kg · Estatura: 100-250 cm · Edad: 14-100 años.");return}
 const imc=peso/((est/100)**2);
 const tmb=10*peso+6.25*est-5*edad+(S.sexo?5:-161),gasto=tmb*ACTF[S.act];
 const meta=Math.round(Math.max(gasto+OBJA[S.obj],S.sexo?1500:1200));
 const opts=SLOTS.map(([s,o])=>[s,o.filter(ok)]),vac=opts.find(([,o])=>!o.length);if(vac){bad("No quedan platillos de "+vac[0].toLowerCase()+" con tus preferencias. Quita alguna e inténtalo de nuevo.");return}let factor=1;
 if(sh===true){S.ord={};opts.forEach(([s,o])=>{const a=o.map((_,j)=>j);for(let j=a.length-1;j>0;j--){const k=Math.floor(Math.random()*(j+1));[a[j],a[k]]=[a[k],a[j]]}S.ord[s]=a})}else S.ord={};
 const mk=f=>DIAS.map((_,i)=>{const d={};opts.forEach(([s,o])=>{const a=S.ord[s]||[],[n,g]=o[a.length===o.length?a[i%o.length]:i%o.length];d[s]=[n,Object.fromEntries(Object.entries(g).map(([k,v])=>[k,v*f]))]});return d});S.plan=mk(1);factor=Math.max(.6,Math.min(2.2,meta/(S.plan.reduce((a,d)=>a+SLOTS.reduce((b,[s])=>b+mac(d[s][1])[0],0),0)/7)));S.plan=mk(factor);
 const tot={};S.plan.forEach(d=>Object.values(d).forEach(([,g])=>{for(const k in g)tot[k]=(tot[k]||0)+g[k]}));
 const por={};for(const k in tot)(por[ING[k][0]]=por[ING[k][0]]||[]).push([k,tot[k]]);
 S.lista=Object.keys(por).map(c=>[CATS[c],por[c].sort((a,b)=>a[0].localeCompare(b[0],"es"))]).sort((a,b)=>a[0].localeCompare(b[0],"es"));
 S.done=[];store("nsd",S.done);
 S.res={imc,cat:catIMC(imc),tmb:Math.round(tmb),gasto:Math.round(gasto),meta,factor,few:opts.filter(([,o])=>o.length<7).map(([s])=>s.toLowerCase()),avg:R(S.plan.reduce((a,d)=>a+SLOTS.reduce((b,[s])=>b+mac(d[s][1])[0],0),0)/7),obj:OBJN[S.obj],aviso:S.obj===0&&imc<18.5};
 save();drawMenu();drawLista();show("menu");
}
function drawMenu(){
 const r=S.res;
 $("#menu").innerHTML=`<h1>Menú semanal</h1><div class="cn"><span>Tu plan de 7 días</span><button id="again">Otro menú</button></div>
 <div class="card"><div class="sum"><div><div class="k">IMC</div><div class="big" data-n="${r.imc.toFixed(1)}">${r.imc.toFixed(1)}</div><div class="cat" style="color:${CATC[r.cat]}">${r.cat}</div></div>
 <div><div class="k">Kcal por día</div><div class="big" data-n="${r.meta}">${r.meta}</div><div class="k">basal ${r.tmb} · gasto ${r.gasto}</div></div></div>
 <div class="k" style="margin-top:12px">Objetivo: ${r.obj} · porciones ×${r.factor.toFixed(2)}<br>Promedio del plan: ${r.avg} kcal por día</div>${r.few.length?`<div class="warn">Con tus preferencias hay pocas opciones de ${r.few.join(", ")}: algunos platillos se repiten.</div>`:""}
 ${r.aviso?`<div class="warn">⚠ Tu IMC indica bajo peso; bajar de peso no es lo recomendable. Consulta a un profesional.</div>`:""}</div>`+
 DIAS.map((d,i)=>`<div class="card day" data-d="${i}"><h3>${d}<span><b class="tk">${R(dayM(i)[0])} kcal</b> <i>›</i></span></h3><div class="mc">${mline(dayM(i))}</div>${SLOTS.map(([s])=>`<div class="s">${s}</div><div class="n">${S.plan[i][s][0]} <span class="kc">${R(mac(S.plan[i][s][1])[0])} kcal</span></div>`).join("")}</div>`).join("");
}
function openDay(i){
 $("#shc").innerHTML=`<h2>${DIAS[i]}</h2><div class="k">Porciones exactas de tu plan · valores aproximados</div><div class="tot"><b>${R(dayM(i)[0])} kcal</b><span>${mline(dayM(i))}</span></div>`+SLOTS.map(([s])=>{const [n,g]=S.plan[i][s];return `<div class="m">${s} · ${R(mac(g)[0])} kcal</div><b>${n}</b><div class="mc">${mline(mac(g))}</div>`+Object.entries(g).map(([k,v])=>`<div class="p"><span>${k}</span><span>${fmtP(k,v)}</span></div>`).join("")}).join("");
 $("#sh").classList.add("on");
}
function drawLista(){
 let n=0;const tot=S.lista.reduce((a,[,x])=>a+x.length,0);
 $("#lista").innerHTML=`<h1>Compras</h1><p class="sub">Lo que necesitas esta semana</p>
 <div class="cn"><span id="cnt"></span><button id="share">Compartir</button></div>`+
 S.lista.map(([c,items])=>`<div class="ch">${c}</div><div class="card">`+items.map(([k,v])=>`<label class="it"><input type="checkbox" data-k="${k}" ${S.done.includes(k)?"checked":""}><span class="bx"></span><span class="t">${k}</span><span class="q">${fmtC(k,v)}</span></label>`).join("")+`</div>`).join("");
 const upd=()=>{$("#cnt").textContent=`${S.done.length} de ${tot} listos`};upd();
 document.querySelectorAll("#lista input").forEach(c=>c.onchange=()=>{const k=c.dataset.k;S.done=c.checked?[...S.done,k]:S.done.filter(x=>x!==k);store("nsd",S.done);upd()});
}
async function share(){
 let t="LISTA DE COMPRAS SEMANAL\n";S.lista.forEach(([c,it])=>{t+=`\n${c.toUpperCase()}\n`;it.forEach(([k,v])=>{t+=`  [${S.done.includes(k)?"x":" "}] ${k} - ${fmtC(k,v)}\n`})});
 try{if(navigator.share)await navigator.share({title:"Lista de compras",text:t});else{await navigator.clipboard.writeText(t);alert("Lista copiada.")}}catch(e){}
}
function addW(){
 const v=parseFloat($("#wv").value.replace(",",".")),d=$("#wd").value,er=$("#werr");
 if(!(v>=20&&v<=300)||!d){er.textContent="Escribe un peso entre 20 y 300 kg y una fecha.";return}
 S.w=S.w.filter(e=>e.d!==d).concat({d,w:Math.round(v*10)/10}).sort((a,b)=>a.d.localeCompare(b.d));
 store("nsw",S.w);drawProg();
}
function drawProg(){
 const L=S.w,n=L.length,last=L[n-1],hoy=new Date(Date.now()-new Date().getTimezoneOffset()*6e4).toISOString().slice(0,10),fd=d=>d.slice(8)+"/"+d.slice(5,7);
 let h=`<h1>Progreso</h1><div class="cn"><span>Opcional: anota tu peso cuando quieras</span></div><div class="card"><div class="row"><span>Peso</span><input id="wv" inputmode="decimal" autocomplete="off" placeholder="${n?last.w:""}"><span class="u">kg</span></div><div class="row"><span>Fecha</span><input id="wd" type="date" value="${hoy}" max="${hoy}"></div><div class="err" id="werr"></div><button class="btn" id="wadd" style="margin-top:6px;padding:12px">Guardar peso</button></div>`;
 if(!n)h+=`<div class="card empty"><b>Sin registros todavía</b><p>Es opcional: la app funciona igual sin registrar tu peso. Anótalo cuando quieras, sin horario fijo.</p></div>`;
 else{
  const xs=L.map(e=>+new Date(e.d)),x0=xs[0],x1=xs[n-1],ws=L.map(e=>e.w),lo=Math.min(...ws)-.5,hi=Math.max(...ws)+.5;
  const X=t=>x1===x0?180:38+(t-x0)/(x1-x0)*292,Y=w=>118-(w-lo)/(hi-lo)*96,pts=L.map((e,i)=>[X(xs[i]).toFixed(1),Y(e.w).toFixed(1)]);
  const diff=last.w-L[0].w,days=Math.round((x1-x0)/864e5);
  h+=`<div class="card"><div class="sum"><div><div class="k">Último peso</div><div class="big">${last.w}</div><div class="k">kg · ${fd(last.d)}</div></div><div><div class="k">Cambio</div><div class="big">${n>1?(diff>0?"+":"")+diff.toFixed(1):"–"}</div><div class="k">${n>1?`kg en ${days} días`:"anota otro peso"}</div></div></div></div>`;
  if(n>1)h+=`<div class="card"><svg viewBox="0 0 340 150" style="width:100%;display:block"><g style="stroke:var(--line)"><line x1="34" x2="334" y1="22" y2="22"/><line x1="34" x2="334" y1="118" y2="118"/></g><text class="ax" x="30" y="25" text-anchor="end">${hi.toFixed(1)}</text><text class="ax" x="30" y="121" text-anchor="end">${lo.toFixed(1)}</text><polyline class="ln" pathLength="1" points="${pts.map(p=>p.join(",")).join(" ")}"/>${pts.map(p=>`<circle class="dt" cx="${p[0]}" cy="${p[1]}" r="3.5"/>`).join("")}<text class="ax" x="38" y="142">${fd(L[0].d)}</text><text class="ax" x="334" y="142" text-anchor="end">${fd(last.d)}</text></svg></div>`;
  h+=`<div class="ch">Registros</div><div class="card">`+L.map((e,i)=>`<div class="row"><span>${fd(e.d)}/${e.d.slice(0,4)}</span><span>${e.w} kg</span><button class="x" data-del="${i}" aria-label="Borrar registro">×</button></div>`).reverse().join("")+`</div>`;
  if(parseFloat($("#peso").value.replace(",","."))!==last.w)h+=`<button class="lk" id="wuse">Usar ${last.w} kg en mi perfil</button>`;
 }
 $("#progreso").innerHTML=h;
}
$("#go").onclick=()=>calcular();
["peso","estatura","edad"].forEach(i=>$("#"+i).addEventListener("input",save));$("#av").addEventListener("input",save);
S.w=load("nsw")||[];const sv=load("ns");if(sv){["peso","estatura","edad"].forEach((i,j)=>$("#"+i).value=sv.v[j]||"");["sexo","act","obj"].forEach(k=>{if(typeof sv[k]==="number")S[k]=sv[k]});if(sv.pf)S.pf=sv.pf;$("#av").value=sv.av||""}
drawSeg();
drawChips();const empty=t=>`<h1>${t[0]}</h1><p class="sub">${t[1]}</p><div class="card empty"><b>Aún no hay datos</b><p>Completa tu perfil y toca «Calcular mi semana».</p></div>`;
$("#menu").innerHTML=empty(["Menú semanal","Tu plan de 7 días"]);$("#lista").innerHTML=empty(["Compras","Lo que necesitas esta semana"]);drawProg();
if(sv&&sv.v&&sv.v.every(x=>x)){S.done=load("nsd")||[];const d=S.done;calcular();S.done=d;drawLista();show("perfil")}
</script>
</body>
</html>
